name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # فحصٌ لا إصلاح: النسخ التي تكتب (`pint`، `--write`، `--fix`) كانت تُصلح في آلة CI ثمّ تُرمى
      # (خطوة الإيداع معلّقة)، فلا يفشل الفحص على تنسيقٍ مخالف أبداً.
      - name: Check PHP style (Pint)
        run: composer lint:check

      # الواجهة: غير مانعَين مؤقّتاً (`continue-on-error`) — 157 ملفّاً لم تُنسَّق قطّ بـPrettier،
      # وتنسيقها دفعةً واحدة (~108 آلاف سطر) قرارٌ للمالك. بعده تُحذف السطران فيصيران مانعَين.
      - name: Check frontend formatting (Prettier)
        run: npm run format:check
        continue-on-error: true

      - name: Lint frontend (ESLint)
        run: npm run lint:check
        continue-on-error: true
